name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true
        default: '0.1.0'
      version_code:
        description: Android version code (increase for every release)
        required: true
        default: '1'

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          CURRENT=$(node -p 'JSON.parse(require("fs").readFileSync("src/data/android-release.json")).versionCode')
          test "$VERSION_CODE" -gt "$CURRENT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/necookie-release.p12"
          chmod 600 "$RUNNER_TEMP/necookie-release.p12"
      - name: Build signed APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/necookie-release.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: necookie
        run: >-
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
          -PappHost=chat.necookie.dev
          -PandroidVersionName="$VERSION" -PandroidVersionCode="$VERSION_CODE"
      - name: Verify and package APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk release/necookie-ai-android.apk
          cd release
          sha256sum necookie-ai-android.apk > necookie-ai-android.apk.sha256
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Necookie AI for Android %s\n\nRequires Android 6.0 or later and an internet connection. Opens https://chat.necookie.dev using your browser.\n\nDownload the APK, then confirm installation in Android. Future releases use the same signing key so you can update without uninstalling.\n' "$VERSION" > release/notes.md
          gh release create "android-v$VERSION" release/necookie-ai-android.apk release/necookie-ai-android.apk.sha256 --title "Necookie AI for Android $VERSION" --notes-file release/notes.md --target "$GITHUB_SHA" --latest
      - name: Remove runner keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/necookie-release.p12"
